<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050a0f">
  <meta name="description" content="Живая интерактивная карта Математической школы №1 имени Х. И. Ибрагимова города Грозного.">
  <title>Математическая школа №1 им. Х. И. Ибрагимова</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section id="loader" class="screen loader" aria-live="polite">
    <div class="loader-stars"></div>
    <div class="loader-core"><div class="loader-ring r1"></div><div class="loader-ring r2"></div><div class="loader-mark">МШ</div></div>
    <p class="loader-kicker">ИНТЕРАКТИВНОЕ ПРОСТРАНСТВО</p>
    <h1>МАТЕМАТИЧЕСКАЯ ШКОЛА №1</h1>
    <p class="loader-sub">им. Х. И. Ибрагимова · г. Грозный</p>
    <div class="progress"><i id="progressBar"></i></div>
    <div class="progress-meta"><span id="progressValue">0%</span><span id="progressStatus">ПОДГОТОВКА ПРОСТРАНСТВА</span></div>
  </section>

  <section id="welcome" class="screen welcome" hidden>
    <div class="welcome-aura"></div>
    <div class="welcome-card">
      <div class="welcome-symbol">✦</div>
      <p>ДОБРО ПОЖАЛОВАТЬ</p>
      <h1>Математическая школа №1</h1>
      <h2>им. Х. И. Ибрагимова<br>г. Грозного</h2>
      <div class="welcome-line"></div>
      <span>Открываем живое пространство школы…</span>
    </div>
  </section>

  <section id="world" class="screen world" hidden aria-label="Живая интерактивная карта школы">
    <div id="mapFrame" class="map-frame">
      <img id="mapImage" src="school-map.png" alt="Карта образовательного пространства Математической школы №1" draggable="false">
      <div class="map-shade"></div>
      <div class="scanline"></div>
      <div class="dust" id="dust"></div>
      <svg id="fxSvg" class="fx-svg" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <filter id="blur10"><feGaussianBlur stdDeviation="10"/></filter>
          <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
          <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="glowStrong"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <linearGradient id="roadPulse" x1="0" x2="1"><stop offset="0" stop-color="#ffd070" stop-opacity="0"/><stop offset=".5" stop-color="#ffe7a7" stop-opacity=".95"/><stop offset="1" stop-color="#ffd070" stop-opacity="0"/></linearGradient>
        </defs>
        <g id="ambientFx"></g>
        <g id="windowFx"></g>
        <g id="pulseFx"></g>
        <g id="hotspots"></g>
      </svg>
      <div id="tooltip" class="tooltip" hidden></div>
      <aside id="infoCard" class="info-card" hidden>
        <button id="infoClose" class="info-close" aria-label="Закрыть">×</button>
        <div id="infoIcon" class="info-icon">✦</div>
        <div id="infoKicker" class="info-kicker"></div>
        <h2 id="infoTitle"></h2>
        <p id="infoText"></p>
      </aside>
      <div class="map-caption"><span>ЖИВАЯ КАРТА</span><b>НАВЕДИТЕ КУРСОР НА ЗДАНИЕ</b></div>
    </div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
