<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04090e">
<title>Математическая школа №1 — живая карта</title>
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<div id="loader" aria-live="polite">
  <div class="loader-orbit"></div><div class="loader-mark">МШ</div>
  <b>МАТЕМАТИЧЕСКАЯ ШКОЛА №1</b><span id="loaderText">ПОДГОТОВКА ПРОСТРАНСТВА</span>
</div>

<main id="app" hidden>
  <div id="viewport" aria-label="Интерактивная карта школы">
    <div id="camera">
      <div id="scene">
        <img id="map" src="school-map.png" draggable="false" alt="Карта школы">
        <svg id="fx" viewBox="0 0 1536 1024" preserveAspectRatio="none" aria-hidden="true"></svg>
        <svg id="hotspots" viewBox="0 0 1536 1024" preserveAspectRatio="none" aria-label="Интерактивные здания"></svg>
      </div>
    </div>
    <div id="hoverLabel" hidden></div>
  </div>

  <aside id="card" hidden>
    <button id="close" aria-label="Закрыть">×</button>
    <div id="cardIcon"></div><small id="cardKind"></small>
    <h1 id="cardTitle"></h1><p id="cardText"></p>
    <div class="line"></div><span class="hint">Нажмите на другое здание или Esc</span>
  </aside>

  <div class="controls">
    <button id="zoomIn" title="Увеличить">+</button>
    <button id="zoomOut" title="Уменьшить">−</button>
    <button id="reset" title="Показать всю карту">⌂</button>
  </div>
  <div class="status"><span class="live-dot"></span> ЖИВОЙ ГОРОД</div>
</main>
<script src="script.js?v=8"></script>
</body></html>
