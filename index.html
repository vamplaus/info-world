<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b12">
  <title>Математическая школа №1 им. Х.И. Ибрагимова г. Грозного</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <section class="loader" id="loader" aria-live="polite">
    <div class="loader-emblem">МШ</div>
    <div class="loader-title">МАТЕМАТИЧЕСКАЯ ШКОЛА №1</div>
    <div class="loader-subtitle">ИМ. Х.И. ИБРАГИМОВА · ГРОЗНЫЙ</div>
    <div class="loader-track"><span></span></div>
    <div class="loader-status" id="loaderStatus">ЗАГРУЗКА КАРТЫ</div>
  </section>

  <section class="welcome" id="welcome" aria-labelledby="welcomeTitle" hidden>
    <div class="welcome-card">
      <div class="ornament">✦</div>
      <p>ДОБРО ПОЖАЛОВАТЬ</p>
      <h1 id="welcomeTitle">Математическая школа №1</h1>
      <h2>им. Х.И. Ибрагимова<br>г. Грозного</h2>
      <button id="enterButton" type="button">Открыть карту школы <span>→</span></button>
    </div>
  </section>

  <section class="map-screen" id="mapScreen" aria-label="Интерактивная карта школы" hidden>
    <img id="schoolMap" src="school-map.png" alt="Интерактивная карта Математической школы №1" draggable="false">

    <!-- Coordinates are percentages of the original 1536×1024 artwork. -->
    <button class="hotspot" style="--x:49%;--y:38%;--w:19%;--h:15%" data-zone="school" aria-label="Математическая школа №1"></button>
    <button class="hotspot" style="--x:23%;--y:19%;--w:17%;--h:16%" data-zone="club" aria-label="Клуб математиков"></button>
    <button class="hotspot" style="--x:39%;--y:22%;--w:13%;--h:13%" data-zone="magic" aria-label="Волшебство"></button>
    <button class="hotspot" style="--x:54%;--y:16%;--w:16%;--h:15%" data-zone="medicine" aria-label="Медицинский кружок"></button>
    <button class="hotspot" style="--x:66%;--y:17%;--w:13%;--h:14%" data-zone="chess" aria-label="Шахматы в школе"></button>
    <button class="hotspot" style="--x:86%;--y:18%;--w:18%;--h:20%" data-zone="ai" aria-label="AI Course"></button>
    <button class="hotspot" style="--x:15%;--y:39%;--w:15%;--h:18%" data-zone="python" aria-label="Python District"></button>
    <button class="hotspot" style="--x:12%;--y:61%;--w:18%;--h:18%" data-zone="exam" aria-label="Exam Arena"></button>
    <button class="hotspot" style="--x:34%;--y:62%;--w:13%;--h:14%" data-zone="animation" aria-label="Студия мульт-анимация"></button>
    <button class="hotspot" style="--x:49%;--y:69%;--w:13%;--h:15%" data-zone="vocal" aria-label="Вокал"></button>
    <button class="hotspot" style="--x:84%;--y:52%;--w:16%;--h:17%" data-zone="robotics" aria-label="Robotics Hub"></button>
    <button class="hotspot" style="--x:66%;--y:66%;--w:15%;--h:17%" data-zone="english" aria-label="English A-Z"></button>
    <button class="hotspot" style="--x:10%;--y:80%;--w:15%;--h:15%" data-zone="judo" aria-label="Дзюдо"></button>
    <button class="hotspot" style="--x:31%;--y:81%;--w:15%;--h:14%" data-zone="dance" aria-label="Танцы народов Кавказа"></button>
    <button class="hotspot" style="--x:56%;--y:80%;--w:15%;--h:15%" data-zone="basketball" aria-label="Баскетбол"></button>
    <button class="hotspot" style="--x:76%;--y:81%;--w:16%;--h:15%" data-zone="volleyball" aria-label="Волейбол"></button>

    <div class="map-caption" id="mapCaption">Нажмите на любое направление</div>
  </section>

  <dialog id="zoneDialog" aria-labelledby="zoneTitle">
    <button class="dialog-close" id="dialogClose" aria-label="Закрыть">×</button>
    <div class="dialog-kicker" id="zoneKicker"></div>
    <h2 id="zoneTitle"></h2>
    <p id="zoneText"></p>
    <button class="dialog-action" id="dialogAction">Понятно</button>
  </dialog>
</main>
<script src="script.js"></script>
</body>
</html>
