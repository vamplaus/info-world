<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b12">
  <title>Математическая школа №1 им. Х.И. Ибрагимова г. Грозного</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="site" aria-label="Математическая школа №1 имени Х. И. Ибрагимова города Грозного">
    <div class="map-frame">
      <img id="schoolMap" class="school-map" src="school-map.png"
           alt="Карта образовательного пространства школы"
           draggable="false" fetchpriority="high">
      <div class="map-shade" aria-hidden="true"></div>
      <div class="map-grain" aria-hidden="true"></div>
    </div>

    <section class="welcome" id="welcome" aria-labelledby="welcomeTitle">
      <div class="welcome-card">
        <div class="welcome-line" aria-hidden="true"></div>
        <p class="welcome-eyebrow">ДОБРО ПОЖАЛОВАТЬ</p>
        <h1 id="welcomeTitle">Математическая школа №1</h1>
        <p class="school-name">им. Х.И. Ибрагимова<br>г. Грозного</p>
        <div class="welcome-divider" aria-hidden="true"><span></span></div>
        <button class="enter-button" id="enterButton" type="button">
          <span>Войти в школу</span><i aria-hidden="true">→</i>
        </button>
        <p class="welcome-hint">Нажмите, чтобы открыть карту школы</p>
      </div>
    </section>

    <div class="loading" id="loading" aria-live="polite">
      <span class="loading-mark"></span><span>Загрузка школы</span>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
